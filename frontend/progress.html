<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress Dashboard — DE Virtual Lab</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="fw-bold text-white mb-1"><i class="bi bi-bar-chart-line text-warning me-2"></i> Student Progress Dashboard</h1>
        <p class="text-secondary mb-0">Track completed virtual lab experiments, quiz scores, and export progress reports.</p>
      </div>
      <div class="d-flex gap-2">
        <button id="btn-export-json" class="btn btn-de-primary btn-sm">
          <i class="bi bi-download me-1"></i> Export JSON Progress
        </button>
        <button id="btn-clear-storage" class="btn btn-outline-danger btn-sm">
          <i class="bi bi-trash me-1"></i> Reset Data
        </button>
      </div>
    </div>

    <!-- Summary Stats Grid -->
    <div class="row g-4 mb-4">
      <div class="col-md-4">
        <div class="de-glass-card p-4 text-center">
          <div class="display-5 fw-bold text-cyan mb-1" id="stat-labs-count">0 / 3</div>
          <div class="text-secondary font-mono small">Experiments Completed</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="de-glass-card p-4 text-center">
          <div class="display-5 fw-bold text-success mb-1" id="stat-quiz-count">0</div>
          <div class="text-secondary font-mono small">Quizzes Attempted</div>
        </div>
      </div>
      <div class="col-md-4">
        <div class="de-glass-card p-4 text-center">
          <div class="display-5 fw-bold text-warning mb-1" id="stat-total-score">0 pts</div>
          <div class="text-secondary font-mono small">Total Learning Points</div>
        </div>
      </div>
    </div>

    <!-- Quiz History Card -->
    <div class="de-glass-card p-4">
      <h4 class="fw-bold text-white mb-3"><i class="bi bi-clock-history text-info me-2"></i> Quiz History Log</h4>
      <div id="quiz-history-mount"></div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { StorageEngine } from '../js/storage.js';
    import { UIEngine } from '../js/ui.js';

    document.addEventListener('DOMContentLoaded', () => {
      const progress = StorageEngine.getUserProgress();
      const completedExp = StorageEngine.getCompletedExperiments();
      const quizScores = StorageEngine.getQuizScores();

      document.getElementById('stat-labs-count').innerText = `${completedExp.length} / 6`;
      document.getElementById('stat-quiz-count').innerText = quizScores.length;
      document.getElementById('stat-total-score').innerText = `${progress.totalScore} pts`;

      const qMount = document.getElementById('quiz-history-mount');
      if (quizScores.length === 0) {
        qMount.innerHTML = `<div class="text-secondary small font-mono">No quiz records found. Take a quiz to record your progress!</div>`;
      } else {
        qMount.innerHTML = `
          <div class="table-responsive">
            <table class="table table-dark table-hover de-table font-mono mb-0">
              <thead>
                <tr>
                  <th>Date & Time</th>
                  <th>Questions</th>
                  <th>Score</th>
                </tr>
              </thead>
              <tbody>
                ${quizScores.map(q => `
                  <tr>
                    <td>${new Date(q.date).toLocaleString()}</td>
                    <td>${q.totalQuestions || 5}</td>
                    <td class="fw-bold text-success">${q.score}%</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      // Export JSON
      document.getElementById('btn-export-json').addEventListener('click', () => {
        const payload = {
          userProgress: progress,
          completedExperiments: completedExp,
          quizScores: quizScores,
          exportedAt: new Date().toISOString()
        };
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
        const dlAnchor = document.createElement('a');
        dlAnchor.setAttribute("href", dataStr);
        dlAnchor.setAttribute("download", "de_virtual_lab_progress.json");
        document.body.appendChild(dlAnchor);
        dlAnchor.click();
        dlAnchor.remove();
        UIEngine.showToast('Progress exported as JSON', 'success');
      });

      // Clear Storage
      document.getElementById('btn-clear-storage').addEventListener('click', () => {
        if (confirm('Are you sure you want to reset all user progress data?')) {
          StorageEngine.clearAll();
          UIEngine.showToast('User progress reset', 'info');
          setTimeout(() => location.reload(), 1000);
        }
      });
    });
  </script>
</body>
</html>
