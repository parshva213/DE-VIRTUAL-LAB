<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>K-Map Solver — DE Virtual Lab</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/simulator.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

  <div id="navbar-mount"></div>

  <main class="container py-4">
    <div class="mb-4 text-center">
      <h1 class="fw-bold text-white mb-1"><i class="bi bi-grid-3x3 text-purple me-2" style="color:#7c4dff;"></i> Karnaugh Map (K-Map) Solver</h1>
      <p class="text-secondary lead">Click grid cells to toggle minterms (0 / 1) and view real-time minimal Boolean SOP expressions.</p>
    </div>

    <!-- K-Map Grid Solver Card -->
    <div class="de-glass-card p-4 mb-4 text-center">
      <div class="d-inline-flex gap-3 mb-4">
        <button class="btn btn-outline-info rounded-pill active font-mono">2 Variables (A, B)</button>
        <button class="btn btn-outline-secondary rounded-pill font-mono" disabled>3 Variables (Coming Soon)</button>
        <button class="btn btn-outline-secondary rounded-pill font-mono" disabled>4 Variables (Coming Soon)</button>
      </div>

      <!-- K-Map Mount Container -->
      <div id="kmap-mount" class="my-3"></div>

      <!-- Output Reduced SOP -->
      <div class="p-3 rounded bg-dark border border-secondary d-inline-block px-5 my-3">
        <span class="small text-muted d-block font-mono">Minimal Simplified Expression:</span>
        <span id="kmap-result-expr" class="fs-3 fw-bold text-success font-mono">Y = 0</span>
      </div>

      <div class="small text-secondary">
        <i class="bi bi-info-circle me-1"></i> Tip: Click any minterm cell (m0..m3) to toggle between 0 and 1.
      </div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { KMapEngine } from '../js/kmap.js';

    document.addEventListener('DOMContentLoaded', () => {
      let cells = [0, 0, 0, 0];

      function update() {
        const solvedExpr = KMapEngine.solve2Var(cells);
        document.getElementById('kmap-result-expr').innerText = solvedExpr;
        KMapEngine.renderGridHTML('kmap-mount', 2, cells, (newCells) => {
          cells = newCells;
          update();
        });
      }

      update();
    });
  </script>
</body>
</html>
