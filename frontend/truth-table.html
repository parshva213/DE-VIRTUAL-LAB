<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Truth Table Generator — DE Virtual Lab</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap"
    rel="stylesheet">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/simulator.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>

<body>

  <div id="navbar-mount"></div>

  <main class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div>
        <h1 class="fw-bold text-white mb-1"><i class="bi bi-table text-success me-2"></i> Truth Table Generator</h1>
        <p class="text-secondary mb-0">Generate complete 2^n state truth tables for primitive gates and multi-input
          logic.</p>
      </div>
      <button id="btn-export-csv-page" class="btn btn-de-primary">
        <i class="bi bi-download me-1"></i> Export CSV
      </button>
    </div>

    <!-- Generator Control Panel -->
    <div class="de-glass-card p-4 mb-4">
      <div class="row g-3">
        <div class="col-md-6">
          <label class="form-label text-secondary font-mono">Select Logic Gate:</label>
          <select id="tt-gate-select" class="form-select bg-dark text-white border-secondary font-mono">
            <option value="AND">AND Gate</option>
            <option value="OR">OR Gate</option>
            <option value="NOT">NOT Gate</option>
            <option value="NAND">NAND Gate</option>
            <option value="NOR">NOR Gate</option>
            <option value="XOR">XOR Gate</option>
            <option value="XNOR">XNOR Gate</option>
          </select>
        </div>
        <div class="col-md-6">
          <label class="form-label text-secondary font-mono">Number of Inputs (N):</label>
          <select id="tt-inputs-select" class="form-select bg-dark text-white border-secondary font-mono">
            <option value="2">2 Inputs (A, B) — 4 Rows</option>
            <option value="3">3 Inputs (A, B, C) — 8 Rows</option>
            <option value="4">4 Inputs (A, B, C, D) — 16 Rows</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Table Container -->
    <div class="de-glass-card p-4">
      <div id="tt-mount-container"></div>
    </div>
  </main>

  <div id="footer-mount"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="../js/app.js"></script>
  <script type="module">
    import { TruthTableEngine } from '../js/truthTable.js';
    import { UIEngine } from '../js/ui.js';

    document.addEventListener('DOMContentLoaded', () => {
      const gSel = document.getElementById('tt-gate-select');
      const iSel = document.getElementById('tt-inputs-select');
      const btnExp = document.getElementById('btn-export-csv-page');

      function update() {
        const gate = gSel.value;
        const numIn = parseInt(iSel.value, 10);
        TruthTableEngine.renderTableHTML('tt-mount-container', gate, gate === 'NOT' ? 1 : numIn);
      }

      gSel.addEventListener('change', update);
      iSel.addEventListener('change', update);
      btnExp.addEventListener('click', () => {
        TruthTableEngine.exportCSV(gSel.value, parseInt(iSel.value, 10));
        UIEngine.showToast('Truth Table exported as CSV!', 'success');
      });

      update();
    });
  </script>
</body>

</html>
